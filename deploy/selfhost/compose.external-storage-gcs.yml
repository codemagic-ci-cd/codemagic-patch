# External GCS storage overlay — merged after docker-compose.selfhost.yml when
# SELFHOST_STORAGE_MODE=gcs. No MinIO: the server talks straight to the
# operator-managed GCS buckets, and caddy serves only the API domain —
# Caddyfile.api-only, because the bundled Caddyfile's storage-domain site
# block would fail Caddy at startup with CODEMAGIC_PATCH_STORAGE_DOMAIN unset.
#
# Env names match server/src/runtime/config.ts (resolveGcsConfig): both
# buckets are required and must differ.
services:
  caddy:
    volumes:
      # Same target as the base file's Caddyfile mount, so this source
      # replaces it (compose merges service mounts by target).
      - ./deploy/selfhost/Caddyfile.api-only:/etc/caddy/Caddyfile:ro

  server:
    environment:
      STORAGE_ADAPTER: gcs
      GCS_PUBLIC_BUCKET: ${GCS_PUBLIC_BUCKET}
      GCS_INTERNAL_BUCKET: ${GCS_INTERNAL_BUCKET}
      # ADC inside the container needs a mounted key file; the installer
      # copies the operator's service-account key to
      # <repo root>/gcs-service-account.json (gitignored).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcs-service-account.json
    volumes:
      - ./gcs-service-account.json:/secrets/gcs-service-account.json:ro

# Bundled MinIO overlay — merged after docker-compose.selfhost.yml when
# SELFHOST_STORAGE_MODE is "bundled" or absent. Compose overrides can add or
# replace keys but never remove them, so everything that must be absent in
# external-storage mode (the minio/minio-init services, the storage
# dependencies, the bundled S3 environment, caddy's storage domain, the data
# volume) lives here instead of the base file. Keep the ${VAR:-default} forms
# exactly as they were pre-split: the bundled rendering is pinned byte-for-byte
# by scripts/selfhost/test/compose-rendering.test.sh. The Caddyfile bind mount
# itself stays in the base file — the external overlays repoint its source at
# the same target, which preserves the pinned mount order.
services:
  caddy:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CODEMAGIC_PATCH_STORAGE_DOMAIN: ${CODEMAGIC_PATCH_STORAGE_DOMAIN}

  server:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: codemagic-patch
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - minio-selfhost-data:/data

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: codemagic-patch
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET}\" &&
      mc anonymous set-json /policy/codemagic-patch-bucket-policy.json \"local/$${S3_BUCKET}\" &&
      echo \"minio bucket ready: $${S3_BUCKET} (public OTA prefix, _internal/* denied)\"
      "
    volumes:
      - ./deploy/selfhost/minio-bucket-policy.json:/policy/codemagic-patch-bucket-policy.json:ro
    restart: "no"

volumes:
  minio-selfhost-data:

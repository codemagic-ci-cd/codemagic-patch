# Bundled Postgres overlay — merged after docker-compose.selfhost.yml when
# SELFHOST_DATABASE_MODE is "bundled" or absent. Compose overrides can add or
# replace keys but never remove them, so everything that must be absent in
# external-DB mode (the postgres service, the server's dependency on it, the
# bundled DATABASE_URL, the data volume) lives here instead of the base file.
services:
  server:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  postgres:
    image: postgres:16.13-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-selfhost-data:/var/lib/postgresql/data

volumes:
  postgres-selfhost-data:

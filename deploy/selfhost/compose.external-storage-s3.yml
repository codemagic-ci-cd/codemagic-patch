# External S3 storage overlay — merged after docker-compose.selfhost.yml when
# SELFHOST_STORAGE_MODE=s3. No MinIO: the server talks straight to the
# operator-managed S3 (or S3-compatible) bucket via the S3_* values in
# .env.selfhost, and caddy serves only the API domain — Caddyfile.api-only,
# because the bundled Caddyfile's storage-domain site block would fail Caddy
# at startup with CODEMAGIC_PATCH_STORAGE_DOMAIN unset.
#
# Env names match server/src/runtime/config.ts (resolveS3Config): S3_BUCKET is
# required, the rest are optional — an empty value renders to the server's own
# default. S3_FORCE_PATH_STYLE carries an explicit false instead: the server
# rejects an empty string where it expects a boolean.
services:
  caddy:
    volumes:
      # Same target as the base file's Caddyfile mount, so this source
      # replaces it (compose merges service mounts by target).
      - ./deploy/selfhost/Caddyfile.api-only:/etc/caddy/Caddyfile:ro

  server:
    environment:
      STORAGE_ADAPTER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Optional, for S3-compatible providers (MinIO, R2, ...); empty = AWS.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Set together, or leave both empty to use the SDK's default credential
      # chain (e.g. EC2/ECS instance roles).
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
